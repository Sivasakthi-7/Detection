title: RMM Tool Abuse - Unauthorized Remote Management Software Installation
id: f6a7b8c9-0024-4a5b-8c6d-e7f8a9b0c1d2
status: experimental
description: >
  Detects installation or execution of remote monitoring and management (RMM)
  tools not on the organization's approved list, which may indicate an attacker
  establishing persistent hands-on-keyboard access using legitimate software.
references:
  - https://attack.mitre.org/techniques/T1219/
  - https://attack.mitre.org/techniques/T1072/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a
author: mikeytrr07
tags:
  - attack.command_and_control
  - attack.t1219
  - attack.persistence
  - attack.t1072
logsource:
  product: windows
  category: process_creation
detection:
  selection_anydesk:
    Image|endswith: '\AnyDesk.exe'
  selection_teamviewer:
    Image|endswith: '\TeamViewer.exe'
  selection_screenconnect:
    Image|contains:
      - 'ScreenConnect'
      - 'ConnectWiseControl'
  selection_atera:
    Image|contains: 'AteraAgent'
  selection_splashtop:
    Image|contains: 'Splashtop'
  selection_rustdesk:
    Image|endswith: '\rustdesk.exe'
  selection_meshcentral:
    Image|contains: 'MeshAgent'
  # Update filter with your approved RMM tool
  filter_approved:
    Image|contains:
      - 'YOUR_APPROVED_RMM'
  condition: (1 of selection_*) and not filter_approved
fields:
  - Computer
  - User
  - Image
  - CommandLine
  - ParentImage
  - Hashes
falsepositives:
  - IT support teams using approved RMM tools (update filter)
  - Software evaluation or trial installations
level: high
